name: Build macOS app

# Builds JSON Compare as a macOS app (Apple Silicon + Intel) on a GitHub-hosted Mac.
#  - Push a tag like v0.1.0 (or publish a Release with a new tag): the .dmg/.zip files are attached to that Release.
#  - Or run it by hand (Actions tab > "Build macOS app" > Run workflow): the files are kept as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a Release

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Make the app's version match the tag (v1.2.3 -> 1.2.3).
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build the app
        run: npm run package:mac

      - name: Show what was built
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: JSON-Compare-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
